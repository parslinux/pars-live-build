# ==============================================================================
# ParsLinux 26.04 LTS (Noble Pars) - GRUB Canlı ISO Menüsü
# ==============================================================================

set default="0"
set timeout=10

insmod font
if loadfont /boot/grub/font.pf2 ; then
    set gfxmode=auto
    insmod efi_gop
    insmod efi_uga
    insmod gfxterm
    terminal_output gfxterm
fi

set menu_color_normal=light-gray/black
set menu_color_highlight=white/blue

# ParsLinux Canlı Seçenekleri
menuentry "🐆 ParsLinux 26.04 LTS Canlı Masaüstü Başlat (GNOME)" --class parslinux --class gnu-linux --class gnu --class os {
    linux /live/vmlinuz boot=live components quiet splash splash-theme=parslinux hostname=parslinux username=pars user-fullname="ParsLinux Canli Kullanici" locales=tr_TR.UTF-8,en_US.UTF-8 keyboard-layouts=tr,us timezone=Europe/Istanbul
    initrd /live/initrd.img
}

menuentry "🛡️ ParsLinux Canlı Masaüstü (Güvenli Grafik Modu - nomodeset)" --class parslinux --class gnu-linux {
    linux /live/vmlinuz boot=live components memtest noapic noapm nodma nomce nolapic nomodeset nosmp vga=normal
    initrd /live/initrd.img
}

menuentry "🚀 Doğrudan ParsLinux Kurulum Sihirbazı (pars-setup)" --class parslinux-installer --class gnu-linux {
    linux /live/vmlinuz boot=live components quiet splash splash-theme=parslinux hostname=parslinux username=pars autostart-installer locales=tr_TR.UTF-8 keyboard-layouts=tr
    initrd /live/initrd.img
}

if [ -f /live/memtest ]; then
    menuentry "🧠 Bellek Testi (Memtest86+)" --class memtest {
        linux16 /live/memtest
    }
fi

if [ "${grub_platform}" == "efi" ]; then
    menuentry "⚙️ UEFI Bellenim (Firmware) Ayarları" {
        fwsetup
    }
fi
