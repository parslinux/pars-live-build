# ==============================================================================
# ParsLinux Canlı ISO - Isolinux / Syslinux Ana Menüsü
# ==============================================================================

default vesamenu.c32
prompt 0
timeout 100

menu title ParsLinux 26.04 LTS (Noble Pars) - Canli Baslatma Menusu
menu background splash.png
menu color title    1;36;44    #ff38bdf8 #00000000 none
menu color sel      7;37;40    #ffffffff #ff0284c7 none
menu color hotsel   1;7;37;40  #ffffffff #ff0284c7 none
menu color timeout  1;37;40    #ff94a3b8 #00000000 none
menu color timeout_msg 1;37;40 #ff94a3b8 #00000000 none
menu vshift 5
menu rows 10
menu width 76

label live-parslinux
    menu label ^1. ParsLinux 26.04 LTS Canli Baslat (GNOME)
    menu default
    linux /live/vmlinuz
    initrd /live/initrd.img
    append boot=live components quiet splash splash-theme=parslinux hostname=parslinux username=pars user-fullname="ParsLinux Canli" locales=tr_TR.UTF-8,en_US.UTF-8 keyboard-layouts=tr,us timezone=Europe/Istanbul

label live-parslinux-failsafe
    menu label ^2. ParsLinux Canli Baslat (Guvenli Grafik - nomodeset)
    linux /live/vmlinuz
    initrd /live/initrd.img
    append boot=live components memtest noapic noapm nodma nomce nolapic nomodeset nosmp vga=normal

label live-parslinux-install
    menu label ^3. Dogrudan ParsLinux Kurulum Sihirbazina Gec
    linux /live/vmlinuz
    initrd /live/initrd.img
    append boot=live components quiet splash splash-theme=parslinux hostname=parslinux username=pars autostart-installer locales=tr_TR.UTF-8 keyboard-layouts=tr

label memtest
    menu label ^4. Bellek Testi (Memtest86+)
    linux /live/memtest

label hd
    menu label ^5. Sabit Diskten Baslat (Local Drive)
    localboot 0x80
